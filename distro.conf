# ==============================================================================
# Niwan Distribution Configuration
# ==============================================================================
# This configuration file controls the entire build pipeline for your custom
# Debian-based Linux distribution.
# ==============================================================================

# OS & Branding
DISTRO_NAME="Niwan"
DISTRO_CODENAME="Genesis"
DISTRO_VERSION="1.0-alpha"
DISTRO_ARCH="amd64"
DISTRO_DESCRIPTION="High-Performance AI-Native Debian Distribution"
DISTRO_URL="https://github.com/hitwardani-create/niwan"

# Debian Base Configuration
# Using 'trixie' (Debian Testing) for latest kernel, Mesa 24+, glibc, and NPU drivers
DEBIAN_CODENAME="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
SECURITY_MIRROR="http://security.debian.org/debian-security"

# Live Environment Credentials
LIVE_USER="niwan"
LIVE_USER_NAME="Niwan Live User"
LIVE_PASSWORD="niwan"
LIVE_HOSTNAME="niwan-live"
ROOT_PASSWORD="niwan"

# Kernel Configuration
# Options:
#   - 'xanmod': High-performance desktop kernel (low-latency, BBR, full preemption)
#   - 'liquorix': Optimized desktop/gaming kernel
#   - 'debian': Stock Debian Testing / Backports kernel with non-free firmware
KERNEL_FLAVOR="xanmod"

# Desktop Environment
# Options: 'kde-plasma-minimal'
DESKTOP_ENV="kde-plasma-minimal"
DISPLAY_MANAGER="sddm"
DEFAULT_SESSION="plasmawayland"

# Performance & Optimization Toggles
ENABLE_ZRAM=true
ZRAM_COMPRESSION_ALGO="zstd"
ZRAM_MEMORY_PERCENT=100
ENABLE_ANANICY_CPP=true
ENABLE_SYSCTL_PERFORMANCE=true
DEFAULT_ROOT_FILESYSTEM="btrfs" # Uses zstd compression via Calamares

# Compute & Hardware Acceleration Stacks
ENABLE_NONFREE_FIRMWARE=true
ENABLE_VULKAN_STACK=true
ENABLE_NVIDIA_DRIVERS=true
ENABLE_AMD_ROCM=true
ENABLE_INTEL_NPU_ONEAPI=true

# C++ Native AI Runtime (llama.cpp)
ENABLE_LLAMACPP=true
LLAMACPP_BUILD_BACKEND="vulkan" # Universal GPU compute (Nvidia, AMD, Intel, CPU)
LLAMACPP_INSTALL_DIR="/usr/local"
ENABLE_LLAMACPP_SERVICE=true
LLAMACPP_DEFAULT_PORT=8080

# Build Directories & Paths
WORK_DIR="$(pwd)/build_work"
ROOTFS_DIR="${WORK_DIR}/rootfs"
ISO_DIR="${WORK_DIR}/iso"
OUTPUT_DIR="$(pwd)/output"
ISO_FILENAME="${DISTRO_NAME,,}-${DISTRO_VERSION}-${DISTRO_ARCH}.iso"
