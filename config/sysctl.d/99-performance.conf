# ==============================================================================
# Niwan Kernel & System Performance Tuning
# ==============================================================================

# Memory Subsystem Optimization
# Lower swappiness to favor physical RAM retention while using zram efficiently
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Filesystem & IO Limits for Heavy Development / AI Compilations
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Network Latency & Throughput (Google BBR Congestion Control)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

# Interactivity & Scheduling
kernel.sched_autogroup_enabled = 1
kernel.nmi_watchdog = 0
